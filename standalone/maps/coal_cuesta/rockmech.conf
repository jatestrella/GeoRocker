# 煤礦範本（單面山）：固定的地質，不隨機
# 柱狀圖（由上往下）：年輕頁岩（只在順向坡腳以外）｜砂岩蓋層（坡頂）｜薄頁岩｜砂岩夾 A 煤（山腰，斷續）｜頁岩｜
# 砂岩夾 B 煤（山腳，主力）｜砂頁岩互層｜厚砂岩夾 C 煤（營地底下約 25 m，往西約 120 m 露頭；露頭只有 1.5～2 m，往東變厚到 9 m）｜砂頁岩互層｜頁岩
# 煤層都夾在砂岩裡（三角洲、河流的沉積環境）；薄砂岩撐出低地丘陵的階梯
rockmech_strata = shale:30,sandstone:20,shale:2,sandstone:2,coal:2.5:60,sandstone:4,shale:10,sandstone:6,coal:6,sandstone:9,shale:10,sandstone:3,shale:12,sandstone:20,coal:9,sandstone:8,shale:8,sandstone:4,shale:10,sandstone:2.5,shale:12,sandstone:4,shale:200
# 傾角 12°、往東傾；柱狀圖頂面在 (0, 0) 的高程（砂岩蓋層頂在營地底下的延伸約 +83 m）
rockmech_strata_attitude = 12,90,113.3
rockmech_strata_kind = coal
# 三層煤的品質（品位倍率，由上往下 A、B、C）：A 薄但乾淨、B 厚但灰分高、C 最厚品質中上
rockmech_strata_grade = 1.08,0.75,0.95
# C 煤沿傾向變厚：u（往東的水平座標）≤ −150 m 是 1.5 m，到 u = +20 m 變成柱狀圖的 9 m（露頭在 u ≈ −125，約 2 m）
rockmech_strata_taper = 3,1.5,-150,20
# 地表風化：煤層離地面 6 m 以內品位變差（露頭最差）
rockmech_weathered_depth = 6
# 單一座單面山：陡崖頂高出平地 45 m，陡崖線沿走向蜿蜒的尺度 150 m
rockmech_terrain = cap,45,150
# 地圖邊緣（mapgen_limit 500）：離中心 420 m 起山，爬升 30 m 到約 40 m 高，山腳以外不能挖
rockmech_map_edge = 420,40,30
# 鐵路：西側南北向的曲線（控制點由北到南），丘陵用路塹切過去、兩端鑽進邊界山的隧道；裝車點在 z = 0
rockmech_railway = -345,440;-345,300;-340,100;-330,-100;-335,-280;-348,-430
rockmech_railway_load = 0
# 往電廠的道路：小鎮的主街往南，順著走向的谷地接到南邊山腳的地磅站，卡車在這裡換手開去電廠（只有傾卸卡車能上公路）
rockmech_haul_gate = 0,-400
# 電廠（名稱:單程秒:每秒卸幾噸；可以用分號列好幾座）
rockmech_power_plants = 燃煤電廠:120:0.5
# 煤礦堆置處（取代小鎮的收煤站）：玩家自己插告示牌劃一塊地堆煤，煤商不定期來買（自己訂售價，超過行情越多越不想買）
rockmech_stockyard = true
rockmech_ores = coal
rockmech_coal_continuity = 1
rockmech_ore_scale = 1
rockmech_gsi_sandstone = 60
rockmech_gsi_shale = 45
rockmech_gsi_coal = 40
# 節理：第 1 組是層面，第 2、3 組陡傾互相垂直（砂岩裡疏、頁岩裡密）
rockmech_joint_set_1 = 12,90,4,0.7,1.5,3
rockmech_joint_dfn_1 = 60,1.5,30,3
rockmech_joint_set_2 = 78,0,4,0.7,2,2
rockmech_joint_dfn_2 = 25,1,12,3.5
rockmech_joint_region_2 = p32=sandstone:0.6,shale:1.5
rockmech_joint_set_3 = 75,95,4.5,0.7,1.5,2
rockmech_joint_dfn_3 = 25,1,12,3.5
rockmech_joint_region_3 = p32=sandstone:0.6,shale:1.5
rockmech_joint_persistence = patch
rockmech_jointtex_style = q5e
rockmech_joint_lattice = 8
rockmech_k_hmax = 1.5
rockmech_k_hmin = 0.8
rockmech_sigma_hmax_azimuth = 90
rockmech_model_scale = 1
rockmech_weakness_c = 0
rockmech_weakness_max_spacing = 1.5
rockmech_strip_soil = true
rockmech_only_lithologies = true
rockmech_lith_mode = zones
rockmech_zone_width = 100000
rockmech_zone_order = shale
rockmech_surface_y = 0
rockmech_geo_seed = 2026
rockmech_design_slope = true
rockmech_village = true
rockmech_career = true
rockmech_solo = true
rockmech_teacher = false
# 燃煤電廠的存煤：賣出的煤都進電廠（測試中，只累加；/powerstats 看日平均）
rockmech_power_plant = true
