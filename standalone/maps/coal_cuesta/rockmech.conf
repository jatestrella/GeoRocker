# 煤礦範本（單面山）：固定的地質，不隨機
# 柱狀圖（由上往下）：年輕頁岩（只在順向坡腳以外）｜砂岩蓋層（坡頂）｜頁岩｜A 煤（山腰，斷續）｜頁岩｜B 煤（山腳，主力）｜
# 頁岩｜薄砂岩｜頁岩｜C 煤（最厚，營地底下約 25 m，往西約 120 m 才露頭）｜頁岩
